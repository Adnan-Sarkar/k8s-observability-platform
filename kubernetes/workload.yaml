apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: obs-workload
  labels:
    app: order-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import sys, time, random, datetime
              items = ["laptop", "monitor", "keyboard", "mouse"]
              seq = 1000
              while True:
                  seq += 1
                  ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
                  item = random.choice(items)
                  if random.random() < 0.25:
                      sys.stderr.write(f"{ts} level=ERROR pod_seq={seq} service=order-worker msg=\"Payment gateway timeout while processing order\" item={item} error_code=PAY_504\n")
                      sys.stderr.flush()
                  else:
                      sys.stdout.write(f"{ts} level=INFO pod_seq={seq} service=order-worker msg=\"Order dispatched to warehouse successfully\" item={item} duration_ms={random.randint(15,180)}\n")
                      sys.stdout.flush()
                  time.sleep(3)
